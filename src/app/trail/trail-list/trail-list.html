<ul>
    @for (trail of trailState.trails(); track trail.id) {
        <li [class.difficult]="trail.difficulty === 'difficult'">
            {{ trail.name }} - {{ trail.lengthKm }} km
        </li>
        <app-trail-card [trail]="trail" (logRequest)="handleLog($event)"/>
    } @empty {
        <li>No trails logged yet.</li>
    }
</ul>

@if (trailState.trails().length > 10) {
    <p>You've logged quite a few trails!</p>
} @else {
    <p>Keep logging to build your trail history.</p>
}
